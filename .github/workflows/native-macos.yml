name: native-macos
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
# Superseded runs cannot validate the newest revision and waste private-repo minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: keyd/go.mod
          cache: false
      - run: npm install --global pnpm@10.29.3
      - run: pnpm install --frozen-lockfile
      - name: Complete app and installer regression suite
        run: pnpm test --maxWorkers=3
      - run: pnpm test:native-macos
