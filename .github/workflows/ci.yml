name: ci
on: [push, pull_request, workflow_dispatch]
# Superseded runs cannot validate the newest revision and waste private-repo minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 installer regression checks
        shell: powershell
        run: |
          ./scripts/install/install-ps1.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/install/setup-probe.test.ps1
      - name: PowerShell 7 installer regression checks
        shell: pwsh
        run: |
          ./scripts/install/install-ps1.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/install/setup-probe.test.ps1
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:codex-release
      - run: pnpm --filter @localdot/brain build
      - run: pnpm --filter @localdot/web build
      # The complete app suite exercises macOS signing/launchd; native-macos runs it.
      - run: pnpm test:remote
      - run: pnpm hygiene
      - run: pnpm --filter @localdot/protocol schema && git diff --exit-code packages/protocol/schema
  keyd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keyd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: keyd/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=darwin go vet ./...
      - run: go test -race ./...
  keyd-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: keyd/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: python3 apps/daemon/src/keyd/testing/test_canary_scan.py
      - run: LOCALDOT_KEYD_TESTS=1 pnpm test:keyd
