daemon off;
pid /tmp/browser-runtime/nginx.pid;
error_log /dev/null;
worker_processes 1;
events { worker_connections 128; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/browser-runtime/client;
  proxy_temp_path /tmp/browser-runtime/proxy;
  fastcgi_temp_path /tmp/browser-runtime/fastcgi;
  uwsgi_temp_path /tmp/browser-runtime/uwsgi;
  scgi_temp_path /tmp/browser-runtime/scgi;
  client_max_body_size 1k;
  client_header_timeout 5s;
  client_body_timeout 5s;
  keepalive_timeout 10s;
  server {
    listen 3000;
    auth_basic "localDot browser";
    auth_basic_user_file /tmp/browser-runtime/stream.htpasswd;
    location = /api/status {
      if ($request_method != GET) { return 405; }
      proxy_pass http://127.0.0.1:8080;
      proxy_pass_request_body off;
      proxy_set_header Authorization "";
      proxy_set_header Content-Length "";
      proxy_set_header Host 127.0.0.1:8080;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }
    location = /api/websockets {
      if ($request_method != GET) { return 405; }
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_set_header Authorization "";
      proxy_set_header Content-Length "";
      proxy_set_header Host 127.0.0.1:8080;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_buffering off;
    }
    location / { return 404; }
  }
}
