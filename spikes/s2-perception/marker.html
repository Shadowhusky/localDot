<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S2 marker</title>
<style>
  body { margin: 0; background: #fff; }
  .m { position: absolute; box-sizing: border-box; border: 0; margin: 0; padding: 0; display: block; }
</style>
</head>
<body>
  <button class="m" aria-label="marker red" style="left: 40px; top: 40px; width: 120px; height: 40px; background: #f00;"></button>
  <a class="m" href="#g" aria-label="marker green" style="left: 300px; top: 200px; width: 200px; height: 30px; background: #0f0;"></a>
  <input class="m" aria-label="marker blue" style="left: 600px; top: 400px; width: 240px; height: 36px; background: #00f;">
</body>
</html>
