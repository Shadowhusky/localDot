<!doctype html>
<meta charset="utf-8">
<title>S8 hosted client</title>
<style>
  body { margin: 0; background: #0A0B0D; color: #EEEFF1; font: 13px system-ui; }
  #stage { display: block; width: 1280px; height: 800px; margin: 16px; background: #000; }
  #desktop { position: absolute; left: -10px; top: -10px; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; }
  #stats { margin: 0 16px; white-space: pre; }
</style>
<canvas id="stage"></canvas>
<pre id="stats">waiting for #videoStream…</pre>
<iframe id="desktop" src="/d/t1/" inert></iframe>
<script type="module">
  const canvas = document.getElementById("stage");
  const statsEl = document.getElementById("stats");
  const frame = document.getElementById("desktop");
  const worker = new Worker("/worker.js");
  const offscreen = canvas.transferControlToOffscreen();
  worker.postMessage({ type: "init", canvas: offscreen }, [offscreen]);
  worker.onmessage = (e) => { statsEl.textContent = JSON.stringify(e.data); };
  let tappedTrackId = null;
  // The clone only sees frames sent after it exists, and the client writes its first frames before
  // the poll can tap: on a still screen nothing follows. So the worker starts from the <video>'s
  // current frame, taken after the clone so that no frame falls between the two.
  const currentFrame = (video) => {
    if (video.readyState < 2) return undefined;
    try {
      return new VideoFrame(video);
    } catch (err) {
      console.log("seed failed", err.message);
      return undefined;
    }
  };
  const tap = () => {
    const video = frame.contentDocument?.getElementById("videoStream");
    const track = video?.srcObject?.getVideoTracks?.()[0];
    if (!track || track.id === tappedTrackId) return;
    tappedTrackId = track.id;
    const processor = new MediaStreamTrackProcessor({ track: track.clone() });
    const first = currentFrame(video);
    const seed = first ? `seed ${first.displayWidth}x${first.displayHeight} ${first.format}` : "no seed";
    const transfer = first ? [processor.readable, first] : [processor.readable];
    worker.postMessage({ type: "frames", readable: processor.readable, first }, transfer);
    console.log("tapped", track.id, `readyState ${video.readyState}, ${seed}`, JSON.stringify(track.getSettings()));
  };
  setInterval(tap, 250);
  window.ldReady = () => tappedTrackId !== null;
</script>
