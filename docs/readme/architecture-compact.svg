<svg xmlns="http://www.w3.org/2000/svg" width="440" height="632" viewBox="0 0 440 632" role="img" aria-label="How localDot works"><title>How localDot works</title><rect width="440" height="632" rx="20" fill="#f6f8fa"/><g font-family="system-ui, -apple-system, sans-serif"><text x="24" y="44" font-size="28" font-weight="700" fill="#24292f">How localDot works</text><rect x="24" y="68" width="392" height="112" rx="14" fill="white" stroke="#b6c3ce"/><text x="44" y="102" font-size="25" font-weight="650" fill="#24292f">1. You ask</text><text x="44" y="132" font-size="22" font-weight="400" fill="#465565">Browser on your computer</text><text x="44" y="160" font-size="22" font-weight="400" fill="#465565">or phone</text><path d="M220 190v22m-7-7 7 7 7-7" fill="none" stroke="#087b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="224" width="392" height="112" rx="14" fill="white" stroke="#b6c3ce"/><text x="44" y="258" font-size="25" font-weight="650" fill="#24292f">2. dot works</text><text x="44" y="288" font-size="22" font-weight="400" fill="#465565">Isolated desktop, browser</text><text x="44" y="316" font-size="22" font-weight="400" fill="#465565">and agent containers</text><path d="M220 346v22m-7-7 7 7 7-7" fill="none" stroke="#087b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="380" width="392" height="112" rx="14" fill="white" stroke="#b6c3ce"/><text x="44" y="414" font-size="25" font-weight="650" fill="#24292f">3. Requests are checked</text><text x="44" y="444" font-size="22" font-weight="400" fill="#465565">Network gate and local vault</text><text x="44" y="472" font-size="22" font-weight="400" fill="#465565">Credentials stay out of the model</text><path d="M220 502v22m-7-7 7 7 7-7" fill="none" stroke="#087b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="220" text-anchor="middle" y="560" font-size="23" font-weight="600" fill="#24292f">Your model, websites and apps</text><text x="220" text-anchor="middle" y="599" font-size="20" font-weight="400" fill="#465565">Screenshots and task text go to your model.</text></g></svg>