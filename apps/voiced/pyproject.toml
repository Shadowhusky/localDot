[project]
name = "voiced"
version = "0.1.0"
description = "localDot voice service: local text-to-speech, forced alignment, speech-to-text and end-of-speech detection"
requires-python = "==3.12.*"
dependencies = [
  "cmudict==1.1.3",
  "mlx==0.32.3",
  "mlx-audio==0.5.7",
  "nagisa==0.3.0",
  "numpy==2.5.3",
  "pyopenjtalk-plus==0.4.1.post9",
  "pypinyin==0.55.0",
  "soundfile==0.14.0",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "websockets==17.1",
]

[project.scripts]
voiced = "voiced.main:main"

[dependency-groups]
dev = ["httpx2==2.13.1", "pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: runs real MLX models from the local Hugging Face cache (GPU-heavy; tell the core session first)"]
addopts = "-m 'not models'"
