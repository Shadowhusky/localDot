<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dot Run</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #120f2a;
        font-family: "Inter", system-ui, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        padding-top: var(--top, 0);
        padding-bottom: var(--bottom, 0);
        box-sizing: border-box;
      }

      #chrome {
        display: none;
        position: relative;
        flex: none;
      }

      [data-desk] #chrome {
        display: block;
      }

      #chrome img {
        display: block;
        width: 100%;
      }

      #tab {
        position: absolute;
        background: #ffffff;
        color: #1f2329;
        font-size: 12.5px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding-left: 6px;
      }

      #tab i {
        width: 0.95em;
        height: 0.95em;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #fff, #c9ccd6);
        box-shadow: 0 0 0 1px rgb(0 0 0 / 0.15);
      }

      #play {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        top: 3.2vmin;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-shadow: 0 0 12px rgb(255 210 120 / 0.6);
      }

      #name {
        left: 3.6vmin;
        font-size: max(13px, 2.6vmin);
        letter-spacing: 0.24em;
        color: #e9e6ff;
        text-shadow: 0 0 14px rgb(140 200 255 / 0.7);
      }

      #score {
        right: 3.6vmin;
        font-size: max(18px, 3.8vmin);
      }

      #score b {
        color: #ffd46b;
        margin-right: 0.3em;
      }
    </style>
  </head>
  <body>
    <div id="chrome"><img src="./chrome.png" alt="" /><div id="tab"><i></i>Dot Run</div></div>
    <div id="play">
      <canvas id="game"></canvas>
      <div id="name" class="hud">DOT RUN</div>
      <div id="score" class="hud"><b>★</b><span id="stars">0</span></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
