<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Postbox</title>
<style>
  @font-face { font-family: "Inter"; src: url("../../assets/fonts/inter.woff2") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1120px; height: 700px; overflow: hidden; font-family: "Inter", sans-serif; color: #1c2230; -webkit-font-smoothing: antialiased; }
  #desk { position: absolute; inset: 0; background: linear-gradient(135deg, #cdc6ee, #e8ecf5 52%, #a8d2ee); }
  .win { position: absolute; left: 10px; top: 10px; right: 10px; bottom: 10px; border-radius: 11px; overflow: hidden; background: #fff; box-shadow: 0 0 0 0.5px rgb(0 0 0 / 0.3), 0 14px 40px rgb(20 30 60 / 0.3); display: flex; flex-direction: column; }

  .tabs { height: 38px; flex: none; background: #dfe2e8; display: flex; align-items: flex-end; padding: 0 10px; gap: 2px; }
  .lights { display: flex; gap: 7px; align-self: center; margin: 0 14px 0 4px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .tab { height: 31px; width: 214px; border-radius: 9px 9px 0 0; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; font-size: 12.5px; font-weight: 500; color: #4a505c; white-space: nowrap; }
  .tab.on { background: #fff; color: #1c2230; }
  .tab span { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .tab svg { flex: none; }
  .tab .x { color: #7b818c; }
  .tab + .tab:not(.on) { box-shadow: inset 1px 0 0 #c3c7cf; border-radius: 0; height: 18px; align-self: center; margin-bottom: 6px; padding-top: 0; }
  .plus { align-self: center; margin: 0 0 6px 8px; color: #5f6570; }

  .tool { height: 42px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid #e3e5ea; color: #5b6470; }
  .omni { flex: 1; height: 30px; border-radius: 15px; background: #eef0f3; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13.5px; color: #1c2230; }
  .omni b { font-weight: 500; }
  .omni .path { color: #6f7682; }
  .omni .star { margin-left: auto; color: #6f7682; }
  .me-sm { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #ff9d6c, #e8567a); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }

  .page { flex: 1; min-height: 0; display: grid; grid-template-columns: 178px 1fr; }
  aside { background: #f6f7fa; padding: 14px 10px; border-right: 1px solid #e8eaef; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 680; letter-spacing: -0.02em; margin: 0 6px 14px; }
  .compose { height: 38px; border-radius: 12px; background: #2f6bff; color: #fff; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14.5px; font-weight: 600; margin-bottom: 12px; box-shadow: 0 2px 6px rgb(47 107 255 / 0.3); }
  .nav { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 9px; font-size: 14px; color: #3a4250; }
  .nav svg { flex: none; color: #6b7280; }
  .nav em { margin-left: auto; font-style: normal; font-size: 12.5px; color: #6b7280; font-weight: 600; }
  .nav.on { background: #e3eaff; color: #1f4fd6; font-weight: 600; }
  .nav.on svg, .nav.on em { color: #1f4fd6; }
  .group { margin: 14px 10px 6px; font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: #8a909b; }
  .label i { width: 9px; height: 9px; border-radius: 3px; flex: none; margin: 0 3px; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { height: 54px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #eceef2; }
  .search { flex: 1; height: 36px; border-radius: 11px; background: #f0f2f5; display: flex; align-items: center; gap: 9px; padding: 0 13px; font-size: 14.5px; color: #7b8290; }
  .me { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .me i { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #ff9d6c, #e8567a); display: grid; place-items: center; color: #fff; font-style: normal; font-weight: 700; font-size: 15px; }
  .split { flex: 1; display: grid; grid-template-columns: 292px 1fr; min-height: 0; }
  .list { border-right: 1px solid #eceef2; overflow: hidden; }
  .row { display: grid; grid-template-columns: 30px 1fr; gap: 0 10px; padding: 9px 14px 9px 12px; border-bottom: 1px solid #f0f1f4; }
  .row.on { background: #eef3ff; box-shadow: inset 3px 0 0 #2f6bff; }
  .row > i { grid-row: span 3; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-weight: 700; font-size: 13px; margin-top: 2px; }
  .row b { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 640; }
  .row small { font-size: 11.5px; color: #7b8290; font-weight: 500; }
  .row span { font-size: 13px; color: #262d3a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row p { font-size: 12.5px; color: #7b8290; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.read b { font-weight: 520; color: #3a4250; }

  .read-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 0 22px 16px; }
  .actions { height: 40px; flex: none; display: flex; align-items: center; gap: 16px; color: #6b7280; border-bottom: 1px solid #f0f1f4; margin: 0 -22px 14px; padding: 0 22px; font-size: 12.5px; }
  .actions .count { margin-left: auto; }
  h2 { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 660; letter-spacing: -0.02em; margin-bottom: 10px; }
  h2 .chip { font-size: 11.5px; font-weight: 600; letter-spacing: 0; color: #17693a; background: #e3f5e9; border-radius: 6px; padding: 3px 7px; }
  .from { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: #4a5260; margin-bottom: 10px; }
  .from i { width: 32px; height: 32px; border-radius: 50%; background: #3f8f7d; display: grid; place-items: center; color: #fff; font-style: normal; font-weight: 700; font-size: 14px; flex: none; }
  .from b { color: #1c2230; font-weight: 640; }
  .from .when { margin-left: auto; color: #7b8290; font-size: 12.5px; }
  .body { font-size: 14.5px; line-height: 1.5; color: #252b38; white-space: pre-line; margin: 0 0 12px 42px; }
  .reply { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-left: 42px; border: 1.5px solid #2f6bff; border-radius: 13px; box-shadow: 0 0 0 4px rgb(47 107 255 / 0.1); }
  .reply small { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #6c7482; padding: 10px 14px 0; }
  .reply p { flex: 1; font-size: 15.5px; line-height: 1.5; color: #1c2230; white-space: pre-wrap; padding: 6px 14px 0; }
  .reply footer { display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-top: 1px solid #eef0f3; color: #6b7280; }
  .send { height: 32px; padding: 0 16px; border-radius: 9px; background: #2f6bff; color: #fff; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: #2f6bff; vertical-align: -0.18em; margin-left: 1px; }
</style>
</head>
<body>
<div id="desk"><div class="win" id="win"></div></div>
<script>
const I = (d, s = 16, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
  fwd: '<path d="M5 12h14M12 5l7 7-7 7"/>',
  reload: '<path d="M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  star: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
  puzzle: '<path d="M10 3h4v3a2 2 0 1 0 4 0V3h3v7h-3a2 2 0 1 0 0 4h3v7h-7v-3a2 2 0 1 0-4 0v3H3v-7h3a2 2 0 1 0 0-4H3V3h7z"/>',
  dots: '<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  starred: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
  sent: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  draft: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  receipt: '<path d="M4 2v20l3-2 3 2 2-2 2 2 3-2 3 2V2l-3 2-3-2-2 2-2-2-3 2Z"/><path d="M8 9h8M8 13h6"/>',
  archive: '<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  reply: '<path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',
  clip: '<path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
  smile: '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
  bold: '<path d="M6 4h8a4 4 0 0 1 0 8H6zM6 12h9a4 4 0 0 1 0 8H6z"/>',
  italic: '<path d="M19 4h-9M14 20H5M15 4 9 20"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
};
const LOGO = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5" width="19" height="14" rx="3.2" fill="#2f6bff"/><path d="m4 8 8 5.5L20 8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const B = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="#c9622f"/><path d="M8.5 6.5h4.2a2.8 2.8 0 0 1 .8 5.5 3 3 0 0 1-.9 5.9H8.5z" fill="#fff"/></svg>`;

const MAILS = [
  ["Tom Hartley", "Mon", "Boiler service next week", "Hi Sam, the engineer can come on Tuesday or Wednesday…", "#3f8f7d", "T"],
  ["Maya", "Mon", "Mum's 60th!", "Friday or Saturday for dinner? I can book the table…", "#d0567f", "M"],
  ["Lisbon Air", "Sun", "Your itinerary", "Friday 9:40 · Seat 14A · 1 checked bag", "#1b84c7", "L"],
  ["Priya N.", "Sun", "Q3 numbers, final", "Here's the last version before Friday. Two small…", "#7a5cc8", "P"],
  ["Brightside Heating", "Fri", "Your invoice is ready", "Invoice 2291 for your annual boiler service…", "#c9622f", "B"],
  ["Green Lane Dental", "Thu", "See you on the 12th", "A reminder of your check-up at 10:30 with…", "#2e9a8c", "G"],
  ["Council Tax", "12 Oct", "Annual statement", "Your statement for this year is now ready to…", "#5c6779", "C"],
  ["Photo Cloud", "9 Oct", "214 photos backed up", "Your holiday album is safe and ready to share…", "#e0a225", "P"],
];

const REPLY = "Hi Tom,\n\nThanks for sorting this so quickly. Tuesday morning works well for me, and someone will be in from 9.\n\nBest,\nSam";

window.render = ({ chars = REPLY.length } = {}) => {
  const rows = MAILS.map(([f, d, s, p, c, l], i) => `<div class="row${i === 0 ? " on" : ""}${i > 2 ? " read" : ""}"><i style="background:${c}">${l}</i><b>${f}<small>${d}</small></b><span>${s}</span><p>${p}</p></div>`).join("");
  document.getElementById("win").innerHTML = `
  <div class="tabs"><div class="lights"><i></i><i></i><i></i></div>
    <div class="tab on">${LOGO(16)}<span>Inbox (12) – Postbox</span><i class="x">${I(ICON.x, 13)}</i></div>
    <div class="tab">${B(15)}<span>Brightside Heating – Bookings</span><i class="x">${I(ICON.x, 13)}</i></div>
    <div class="plus">${I(ICON.plus, 15)}</div></div>
  <div class="tool">${I(ICON.back, 17)}${I(ICON.fwd, 17).replace("currentColor", "#b5bac3")}${I(ICON.reload, 16)}
    <div class="omni">${I(ICON.lock, 13)}<span><b>postbox.mail</b><span class="path">/inbox</span></span><span class="star">${I(ICON.star, 15)}</span></div>
    ${I(ICON.puzzle, 16)}<div class="me-sm">S</div>${I(ICON.dots, 16)}</div>
  <div class="page">
    <aside><div class="logo">${LOGO(24)}Postbox</div>
      <div class="compose">${I(ICON.pen, 15)}Compose</div>
      <div class="nav on">${I(ICON.inbox)}Inbox<em>12</em></div>
      <div class="nav">${I(ICON.starred)}Starred</div>
      <div class="nav">${I(ICON.sent)}Sent</div>
      <div class="nav">${I(ICON.draft)}Drafts<em>1</em></div>
      <div class="nav">${I(ICON.receipt)}Invoices</div>
      <div class="nav">${I(ICON.archive)}Archive</div>
      <div class="group">Labels</div>
      <div class="nav label"><i style="background:#2fa36b"></i>Home</div>
      <div class="nav label"><i style="background:#e8567a"></i>Family</div>
      <div class="nav label"><i style="background:#1b84c7"></i>Travel</div>
    </aside>
    <main><header><div class="search">${I(ICON.search, 16)}Search your mail</div><div class="me"><i>S</i>Sam</div></header>
      <div class="split"><div class="list">${rows}</div>
        <div class="read-pane">
          <div class="actions">${I(ICON.archive)}${I(ICON.trash)}${I(ICON.mail)}${I(ICON.clock)}<span class="count">1 of 12</span></div>
          <h2>Boiler service next week<span class="chip">Home</span></h2>
          <div class="from"><i>T</i><span><b>Tom Hartley</b> to me</span><span class="when">Mon 2 Nov, 18:12</span></div>
          <div class="body">Hi Sam,
The engineer can come on Tuesday or Wednesday morning, any time after 8. It takes about an hour. Which suits you best?
Thanks, Tom</div>
          <div class="reply"><small>${I(ICON.reply, 14)}Reply to Tom Hartley</small>
            <p>${REPLY.slice(0, chars)}<span class="caret"></span></p>
            <footer><div class="send">Send</div>${I(ICON.bold, 15)}${I(ICON.italic, 15)}${I(ICON.clip, 15)}${I(ICON.image, 15)}${I(ICON.smile, 15)}</footer></div>
        </div></div></main>
  </div>`;
};
window.render();
</script>
</body>
</html>
