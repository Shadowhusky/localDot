<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blue Hour — A3 poster</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Print sheet: A3 trim (297 x 420 mm) + 3 mm bleed + crop marks.
     Page = 313 x 436 mm, trim box inset 8 mm, artwork bleeds 3 mm past the trim. */
  @page { size: 313mm 436mm; margin: 0; }

  html, body { background: #fff; }

  .page { position: relative; width: 313mm; height: 436mm; background: #fff; overflow: hidden; }

  .sheet {
    position: absolute;
    left: 8mm; top: 8mm;
    --sheet-w: 297mm;
    --sheet-h: 420mm;
    --pad-x: 22mm;
    --pad-y: 19mm;

    --fs-eyebrow: 4.4mm;
    --fs-display: 88mm;   /* title */
    --fs-label: 4mm;
    --fs-value: 13mm;
    --fs-badge: 5.6mm;
    --badge-pad: 2.6mm 4mm;

    --hairline: .3mm;
    --gap-s: 3mm;
    --gap-m: 8mm;
    --gap-r: 7mm;
    --title-gap: 13mm;
    --band-gap: 0;

    box-shadow: 0 0 0 3mm var(--night);   /* 3 mm bleed all round */
  }

  /* the illustration runs 3 mm into the bleed on both sides */
  .band { margin-left: calc(-1 * var(--pad-x) - 3mm); margin-right: calc(-1 * var(--pad-x) - 3mm); }

  .marks { position: absolute; left: 0; top: 0; width: 313mm; height: 436mm; }
</style>
</head>
<body>
  <div class="page">
    <div class="sheet">
      <header class="hdr">
        <p class="eyebrow">The Lantern presents</p>
        <p class="eyebrow eyebrow--dim">Live jazz</p>
      </header>
      <div class="rule"></div>

      <h1 class="title"><span>Blue</span><span class="row">Hour<i class="mark"></i></span></h1>

      <div class="band"><img src="illo.svg" alt=""></div>

      <footer class="foot">
        <div class="rule"></div>
        <div class="details">
          <div>
            <p class="label">When</p>
            <p class="value">Friday<br>21 November</p>
          </div>
          <div>
            <p class="label">Where</p>
            <p class="value">The Lantern</p>
          </div>
          <div>
            <p class="label">Time</p>
            <p class="value">8 pm</p>
          </div>
          <div>
            <p class="label">Entry</p>
            <span class="badge">Free</span>
          </div>
        </div>
      </footer>
    </div>

    <!-- crop marks, aligned with the trim box (8 mm / 305 / 428 mm) -->
    <svg class="marks" viewBox="0 0 313 436" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g stroke="#000000" stroke-width="0.25" fill="none">
        <line x1="8"   y1="1"   x2="8"   y2="5"/>
        <line x1="1"   y1="8"   x2="5"   y2="8"/>
        <line x1="305" y1="1"   x2="305" y2="5"/>
        <line x1="308" y1="8"   x2="312" y2="8"/>
        <line x1="8"   y1="431" x2="8"   y2="435"/>
        <line x1="1"   y1="428" x2="5"   y2="428"/>
        <line x1="305" y1="431" x2="305" y2="435"/>
        <line x1="308" y1="428" x2="312" y2="428"/>
      </g>
    </svg>
  </div>
</body>
</html>
