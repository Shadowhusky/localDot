<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blue Hour — Instagram 1080 × 1350</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* same system, re-set for the portrait social crop */
  .sheet {
    --sheet-w: 1080px;
    --sheet-h: 1350px;
    --pad-x: 76px;
    --pad-y: 56px;

    --fs-eyebrow: 21px;
    --fs-display: 222px;
    --fs-label: 24px;
    --fs-value: 42px;
    --fs-badge: 28px;
    --badge-pad: 12px 20px;

    --hairline: 2px;
    --gap-s: 14px;
    --gap-m: 40px;
    --gap-r: 20px;
    --title-gap: 34px;
    --band-gap: 0;
  }
</style>
</head>
<body>
  <div class="sheet">
    <header class="hdr">
      <p class="eyebrow">The Lantern presents</p>
      <p class="eyebrow eyebrow--dim">Live jazz</p>
    </header>
    <div class="rule"></div>

    <h1 class="title"><span>Blue</span><span class="row">Hour<i class="mark"></i></span></h1>

    <div class="band"><img src="illo.svg" alt=""></div>

    <footer class="foot">
      <div class="rule"></div>
      <div class="details">
        <div>
          <p class="label">When</p>
          <p class="value">Friday<br>21 November</p>
        </div>
        <div>
          <p class="label">Where</p>
          <p class="value">The Lantern</p>
        </div>
        <div>
          <p class="label">Time</p>
          <p class="value">8 pm</p>
        </div>
        <div>
          <p class="label">Entry</p>
          <span class="badge">Free</span>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
